<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bite Club</title>
  <meta name="description" content="Track calories and macros toward your goal weight.">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bite Club">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
  <header class="topbar">
    <button class="profile-chip" id="profileChip" aria-label="Switch profile"></button>
    <div class="date-nav" id="dateNav">
      <button class="icon-btn" data-act="day-prev" aria-label="Previous day">‹</button>
      <button class="date-label" data-act="day-today" id="dateLabel"></button>
      <button class="icon-btn" data-act="day-next" aria-label="Next day">›</button>
    </div>
    <span class="topbar-spacer"></span>
  </header>

  <main id="main">
    <section class="view" id="view-today"></section>
    <section class="view" id="view-fitness" hidden></section>
    <section class="view" id="view-progress" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab active" data-tab="today"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg><span>Today</span></button>
    <button class="tab" data-tab="fitness"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h3l3-7 4 14 3-7h5"/></svg><span>Fitness</span></button>
    <button class="tab add-tab" data-act="open-add" aria-label="Add"><span class="plus">+</span></button>
    <button class="tab" data-tab="progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Progress</span></button>
    <button class="tab" data-tab="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="coach-pop" id="coachPop" role="status" aria-live="polite" hidden></div>

  <canvas id="confetti" hidden></canvas>
  <input type="file" id="photoInput" accept="image/*" multiple hidden>
  <input type="file" id="shotInput" accept="image/*" multiple hidden>
  <input type="file" id="progressPhotoInput" accept="image/*" hidden>
  <input type="file" id="labelInput" accept="image/*" multiple hidden>
  <input type="file" id="planInput" accept="application/json,.json" hidden>
  <input type="file" id="importInput" accept="application/json" hidden>

  <script type="module" src="app.js?v=31"></script>
</body>
</html>
